<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Network Connection Lines -->
  <g stroke="#10b981" stroke-width="6" stroke-dasharray="8 6" opacity="0.6">
    <line x1="256" y1="200" x2="140" y2="340" />
    <line x1="256" y1="200" x2="372" y2="340" />
    <line x1="140" y1="340" x2="372" y2="340" />
    <line x1="256" y1="250" x2="256" y2="380" />
  </g>

  <!-- Central Database Symbol -->
  <g filter="url(#shadow)">
    <!-- Top Cylinder Cap -->
    <ellipse cx="256" cy="140" rx="90" ry="32" fill="url(#accent)"/>
    <ellipse cx="256" cy="140" rx="75" ry="24" fill="#6ee7b7"/>

    <!-- Cylinder Tier 1 -->
    <path d="M 166 140 v 50 c 0 18 40 32 90 32 s 90 -14 90 -32 v -50 Z" fill="#047857"/>
    <ellipse cx="256" cy="190" rx="90" ry="32" fill="#10b981" opacity="0.3"/>

    <!-- Cylinder Tier 2 -->
    <path d="M 166 195 v 50 c 0 18 40 32 90 32 s 90 -14 90 -32 v -50 Z" fill="#065f46"/>
    <ellipse cx="256" cy="245" rx="90" ry="32" fill="#34d399" opacity="0.4"/>
  </g>

  <!-- Network Node: Retail Shop (Left) -->
  <g transform="translate(140, 340)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <circle cx="0" cy="0" r="36" fill="#047857"/>
    <!-- Storefront Icon -->
    <path d="M -16 -8 L 16 -8 L 20 2 L -20 2 Z M -18 4 L 18 4 L 18 16 L -18 16 Z M -6 6 L 6 6 L 6 16 L -6 16 Z" fill="#ffffff"/>
  </g>

  <!-- Network Node: Mechanic / Wrench (Right) -->
  <g transform="translate(372, 340)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <circle cx="0" cy="0" r="36" fill="#047857"/>
    <!-- Wrench Icon -->
    <path d="M -4 -16 C -12 -14 -16 -6 -14 2 L -2 14 C 0 16 4 16 6 14 L 14 6 C 16 4 16 0 14 -2 L 2 -14 C -1 -16 -3 -16 -4 -16 Z" fill="#ffffff"/>
    <circle cx="-6" cy="-8" r="4" fill="#047857"/>
  </g>

  <!-- Network Node: ID / Security Badge (Bottom Center) -->
  <g transform="translate(256, 395)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="38" fill="#ffffff"/>
    <circle cx="0" cy="0" r="32" fill="#10b981"/>
    <!-- Shield / ID Card -->
    <path d="M 0 -14 L 12 -9 V 2 C 12 10 0 16 0 16 C 0 16 -12 10 -12 2 V -9 Z" fill="#ffffff"/>
    <path d="M -4 -1 L 0 3 L 6 -3" stroke="#064e3b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Monogram / Banner -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#a7f3d0" letter-spacing="4">JAY AMBE</text>
</svg>
