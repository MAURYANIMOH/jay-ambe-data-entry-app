name: Build Jay Ambe Android APK (Custom Fields)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q jay-ambe-data-entry-app-android-ready.zip -d source
          cp -a extracted-source/src/. source/jay_app_check/src/
          cp 1794290376979.gif source/jay_app_check/public/jay-ambe-splash.gif
          mkdir -p source/jay_app_check/assets
          cp jay-ambe-app-icon.png source/jay_app_check/assets/icon-only.png
          cd source/jay_app_check
          sed -i "s/com.jayambe.dataentry/com.jayambe.dataentry.v2/" capacitor.config.ts
          echo "APP_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and build
        run: |
          cd "$APP_DIR"
          mkdir -p assets
          npm install --legacy-peer-deps
          npm install --save-dev "typescript@npm:@typescript/typescript6@^6.0.2" --legacy-peer-deps
          npm install @capacitor/android@^7.4.3 @capacitor/app@^7.1.0 @capacitor/share@^7.0.2 @capacitor/filesystem@^7.1.4 --legacy-peer-deps
          npm install --save-dev @capacitor/assets --legacy-peer-deps
          npm install @capacitor-firebase/authentication@7.5.0 firebase --legacy-peer-deps
          npm run build
          npx cap add android
          cp "$GITHUB_WORKSPACE/google-services.json" android/app/google-services.json
          # Enable Google Services for native Firebase phone authentication.
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.4'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jayambe-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/jayambe-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/jayambe-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APP_DIR/android/app/build/outputs/apk/release/JAY-AMBE-DATA-ENTRY-APP.apk" "$RUNNER_TEMP/jayambe-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$APP_DIR/android/app/build/outputs/apk/release/JAY-AMBE-DATA-ENTRY-APP.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAY-AMBE-ANDROID-APK
          path: source/jay_app_check/android/app/build/outputs/apk/release/JAY-AMBE-DATA-ENTRY-APP.apk

# Trigger signed APK build after repository signing secrets were configured.
