name: Build Jay Ambe Android APK (Custom Fields)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q jay-ambe-data-entry-app-android-ready.zip -d source
          cp -a extracted-source/src/. source/jay_app_check/src/
          cd source/jay_app_check
          sed -i "s/com.jayambe.dataentry/com.jayambe.dataentry.v2/" capacitor.config.ts
          echo "APP_DIR=$PWD" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install and build
        run: |
          cd "$APP_DIR"
          mkdir -p assets
          cp ../../jay-ambe-app-icon.png assets/logo.png
          npm install --legacy-peer-deps
          npm install --save-dev "typescript@npm:@typescript/typescript6@^6.0.2" --legacy-peer-deps
          npm install @capacitor/android@^7.4.3 --legacy-peer-deps
          npm install --save-dev @capacitor/assets --legacy-peer-deps
          npm run build
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAY-AMBE-ANDROID-APK
          path: source/jay_app_check/android/app/build/outputs/apk/debug/app-debug.apk
