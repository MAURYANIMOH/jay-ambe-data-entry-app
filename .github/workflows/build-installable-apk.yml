name: Build Jay Ambe APK (installable debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          mkdir source
          unzip -q jay-ambe-data-entry-app-android-ready.zip -d source
          cp -a extracted-source/src/. source/jay_app_check/src/
          cp 1794290376979.gif source/jay_app_check/public/jay-ambe-splash.gif
          mkdir -p source/jay_app_check/assets
          mkdir -p source/jay_app_check/assets source/jay_app_check/public
          # Use the exact splash GIF artwork for the launcher icon.
          # Use its first frame and fit the entire image inside a transparent square (no crop).
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          im = Image.open('1794290376979.gif').convert('RGBA')
          # Dashboard uses the original artwork without the launcher safe-area padding.
          im.save('source/jay_app_check/public/jay-ambe-dashboard-logo.png')
          # Fill the complete launcher icon area with the artwork; Android applies its round mask.
          # Fit artwork edge-to-edge so there is no empty transparent border.
          foreground = ImageOps.fit(im, (1024, 1024), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          foreground.save('source/jay_app_check/assets/icon-only.png')
          foreground.save('source/jay_app_check/assets/icon-foreground.png')
          background = Image.new('RGBA', (1024, 1024), (4, 78, 62, 255))
          background.save('source/jay_app_check/assets/icon-background.png')
          PY
          cp source/jay_app_check/assets/icon-only.png source/jay_app_check/public/jay-ambe-app-icon.png
          cd source/jay_app_check
          sed -i "s/com.jayambe.dataentry/com.jayambe.dataentry.v2/" capacitor.config.ts
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.jayambe.dataentry.v2',
            appName: 'JAY AMBE DATA ENTRY APP',
            webDir: 'dist',
            android: { allowMixedContent: false },
            plugins: { FirebaseAuthentication: { skipNativeAuth: false, providers: ['phone'] } },
          };
          export default config;
          EOF
          echo "APP_DIR=$PWD" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Build APK
        run: |
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm install --save-dev "typescript@npm:@typescript/typescript6@^6.0.2" --legacy-peer-deps
          npm install @capacitor/android@^7.4.3 @capacitor/app@^7.1.0 @capacitor/share@^7.0.2 @capacitor/filesystem@^7.1.4 --legacy-peer-deps
          npm install --save-dev @capacitor/assets --legacy-peer-deps
          npm install @capacitor-firebase/authentication@7.5.0 firebase --legacy-peer-deps
          npm run build
          npx cap add android
          cp "$GITHUB_WORKSPACE/google-services.json" android/app/google-services.json
          # Enable the Google Services Gradle plugin required by Firebase Android Auth.
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.4'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          npx @capacitor/assets generate --android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JAY-AMBE-ANDROID-APK
          path: source/jay_app_check/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="source/jay_app_check/android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" JAY-AMBE-ANDROID-APK.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest JAY-AMBE-ANDROID-APK.apk --title "JAY AMBE DATA ENTRY APP" --notes "Latest Android APK download." --latest
